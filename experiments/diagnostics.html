<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insurance Land · “Standard”</title>
<style>
:root{font:14px/1.45 system-ui;color:#24313a;background:#fff}*{box-sizing:border-box}body{max-width:1320px;margin:0 auto;padding:20px 28px}h1,h2,h3{margin:0;text-wrap:balance}h1{font-size:23px;line-height:1.2}h2{font-size:18px}h3{font-size:13px;font-weight:600}p{text-wrap:pretty}button,select,input{font:inherit;color:inherit}button,select{border:1px solid #d8dfe3;background:white;border-radius:5px;padding:6px 9px}button{cursor:pointer}button:hover{background:#f3f6f8}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #245b91;outline-offset:3px}button[aria-pressed=true]{background:#eaf2f8;border-color:#245b91;color:#245b91}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.world-name{margin:3px 0 0;color:#68747d;font-size:13px}.header-actions,.person-buttons,#firms{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.header-actions{gap:18px}#worlds button{border-color:transparent;padding:6px 12px}#worlds button[aria-pressed=true]{border-color:#d2e1ed}summary{cursor:pointer;color:#68747d}details p{margin:8px 0}a{color:#245b91}.controls{display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid #e6eaed;margin-top:12px}.timeline{display:flex;align-items:center;gap:12px;flex:1;min-width:120px}.timeline input{width:100%;min-width:50px;accent-color:#245b91}.period-text{white-space:nowrap;font-variant-numeric:tabular-nums}.step{font-size:18px;width:32px;padding:2px}.map-select{display:flex;align-items:center;gap:8px;color:#68747d}.layout{display:grid;grid-template-columns:minmax(300px,1.15fr) minmax(320px,1fr);gap:32px}.map-panel{min-width:0}.agent-panel{border-left:1px solid #e6eaed;padding-left:28px;min-width:0}.grid{display:grid;gap:2px;width:min(100%,60dvh);margin:0 auto}.cell{aspect-ratio:1;padding:0;min-width:0;border-radius:1px;font-size:10px;border:1px solid transparent}.cell.selected{border:2px solid #245b91}.cell.residence{outline:2px dashed #ba5a22;outline-offset:-3px}.cell.hit{box-shadow:inset 0 0 0 2px #8b2525}.cell.destroyed{background:#e2e5e7!important;color:#555}.muted,dt{color:#68747d}#status{font-size:12px;color:#68747d;margin:10px 0 16px;font-variant-numeric:tabular-nums}.agent-heading{display:flex;justify-content:space-between;gap:10px;align-items:center}.firms{display:flex;gap:6px;align-items:center}.firms>span{font-size:11px;color:#68747d}#firms button{font-size:12px;padding:4px 7px}#roles{font-size:12px;color:#68747d;margin:5px 0 16px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;margin:0 0 24px;font-variant-numeric:tabular-nums}dt{font-size:11px}dd{margin:3px 0 0;font-weight:600;font-size:15px;overflow-wrap:anywhere}.chart{display:block;width:100%;height:auto}#chartTitle{margin-bottom:6px}.chart-key{display:flex;gap:16px;font-size:11px;color:#68747d;margin:0 0 22px}.blue{color:#245b91}.orange{color:#ba5a22}.flow-heading{border-top:1px solid #e6eaed;padding-top:14px;margin-bottom:6px}table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}th,td{padding:7px 4px;text-align:left;border-bottom:1px solid #eef1f3}th{color:#68747d;font-weight:400}.scroll{max-height:190px;overflow:auto}.scroll>p{font-size:12px;color:#68747d}.home-heading{display:flex;gap:8px;align-items:center;font-size:12px;color:#68747d}.home-heading strong{color:#24313a}.person-buttons button{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 7px}.person-buttons svg{width:14px;height:14px}#home{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:44px;padding-bottom:10px}#home details{font-size:12px}#home details[open]{flex-basis:100%}.map-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:12px}.map-footer select{max-width:220px;font-size:12px}.map-footer label{display:flex;align-items:center;gap:6px;color:#68747d}.map-help{margin-top:8px;font-size:12px;color:#68747d}.map-help p{margin:6px 0}#eventInfo{font-size:11px;color:#68747d;margin:8px 0}.legend{font-size:12px}.money{font-variant-numeric:tabular-nums}
@media(max-width:950px){body{padding:16px}.layout{gap:20px}.agent-panel{padding-left:20px}.agent-heading{align-items:start;flex-direction:column}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.header-actions{gap:10px}}
@media(max-width:700px){header{align-items:start}.header-actions{align-items:end;flex-direction:column}.controls{flex-wrap:wrap;gap:8px}.timeline{min-width:160px}.layout{grid-template-columns:1fr}.agent-panel{border-left:0;border-top:1px solid #e6eaed;padding:20px 0 0}.grid{width:100%;max-width:540px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.agent-heading{flex-direction:row}.cell{font-size:9px}.map-select{font-size:12px}#worlds button{padding:5px 7px}}
.chart-controls{display:flex;gap:4px;margin:0 0 14px;flex-wrap:wrap}.chart-controls button{font-size:12px;border-color:transparent;padding:5px 9px}.chart-controls button[aria-pressed=true]{border-color:#d2e1ed}.chart-key{margin-bottom:6px;flex-wrap:wrap}#chartNote{font-size:11px;color:#68747d;margin:4px 0}#chartValues{font-size:12px;font-variant-numeric:tabular-nums;margin:8px 0 16px}
</style>
<header><div><h1>Insurance Land</h1><p class="world-name" id="worldName">“Standard” world</p></div><div class="header-actions"><div id="worlds" class="person-buttons" aria-label="World selection"></div></div></header>
<div class="controls"><button class="step" id="previous" aria-label="Previous period">‹</button><label class="timeline"><span class="period-text">Period <output id="periodLabel"></output></span><input id="period" type="range" min="0" value="0"></label><button class="step" id="next" aria-label="Next period">›</button><label class="map-select">View<select id="layer"><option value="ownership">Owners</option><option value="residence">Residents</option><option value="value">Home values</option><option value="coverage">Coverage</option><option value="damage">Damage</option></select></label></div>
<p id="status" aria-live="polite"></p>
<main class="layout"><section class="map-panel" aria-label="World map"><section id="home" aria-live="polite"></section><div id="grid" class="grid" aria-label="Homes"></div><p id="coverageKey" class="muted" hidden style="font-size:11px;margin:6px 0">B · Building &nbsp; R · Renters’ contents &nbsp; R/B · Both</p><div class="map-footer"><span class="muted">Click a home to explore</span><label>Events<select id="event"><option value="">All events this period</option></select></label></div><p id="eventInfo"></p><details class="map-help"><summary>Map key</summary><p id="legend"></p><p>Blue border: selected owner or insurer. Orange dashed border: residence. Red inset: disaster footprint. ×: destroyed home.</p></details></section>
<section class="agent-panel" aria-label="Selected agent"><div class="agent-heading"><h2 id="agentTitle"></h2><div class="firms"><span>Insurers</span><div id="firms"></div></div></div><p id="roles"></p><dl id="stats" class="stats"></dl><div class="chart-controls" aria-label="Chart view"><button data-chart="balance" aria-pressed="true">Balance</button><button data-chart="flows" aria-pressed="false">Cash flow</button><button data-chart="claims" aria-pressed="false">Claims</button><button data-chart="disasters" aria-pressed="false">Disasters</button></div><h3 id="chartTitle"></h3><div id="history"></div><div class="chart-key" id="chartKey"></div><p id="chartNote"></p><p id="chartValues" aria-live="polite"></p><h3 class="flow-heading">This period’s payments</h3><div id="flows" class="scroll"></div></section></main>
<script id="data" type="application/json">__WORLD_DATA__</script>
<script>
'use strict';
const bundle=JSON.parse(document.getElementById('data').textContent);
const worlds=bundle.worlds??{Standard:bundle};
let worldName=bundle.default??'Standard',data=worlds[worldName],frames=data.frames;
const $=id=>document.getElementById(id), money=n=>Number(n).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2});
let chartView='balance';
let period=0,homeId=frames[0].homes[0].id,selectedKind="person",selectedId=frames[0].homes[0].owner;

Object.keys(worlds).forEach(name=>{const b=document.createElement('button');b.textContent=`“${name}”`;b.dataset.world=name;b.onclick=()=>{worldName=name;data=worlds[name];frames=data.frames;period=Math.min(period,frames.length-1);$('period').max=frames.length-1;events();render();};$('worlds').append(b);});
$('period').max=frames.length-1;
const palette=['#b3cde3','#ccebc5','#fed9a6','#decbe4','#ffffcc','#e5d8bd','#fbb4ae','#d9d9d9'];
const shape=[Math.max(...frames[0].homes.map(h=>h.position[0]))+1,Math.max(...frames[0].homes.map(h=>h.position[1]))+1];
$('grid').style.gridTemplateColumns=`repeat(${shape[1]},minmax(0,1fr))`;
const buttons=new Map();
frames[0].homes.forEach(h=>{let b=document.createElement('button');b.className='cell';b.style.gridRow=h.position[0]+1;b.style.gridColumn=h.position[1]+1;b.onclick=()=>{homeId=h.id;const now=frames[period].homes.find(x=>x.id===h.id);selectPerson($("layer").value==="residence"&&now.resident?now.resident:now.owner);};$('grid').append(b);buttons.set(h.id,b);});
const initialMax=Math.max(...Object.values(worlds).flatMap(w=>w.frames[0].homes.map(h=>Number(h.value))));
function covered(frame){const t=Math.max(frame.period,1);return data.contracts.filter(c=>c.starts<=t&&c.ends>=t&&!frame.homes.find(h=>h.id===c.home).destroyed);}
const personIcon='<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg>';
frames[0].firms.forEach(f=>{const button=document.createElement('button');button.textContent=`Firm ${f.name}`;button.dataset.firm=f.id;button.onclick=()=>{selectedKind='firm';selectedId=f.id;render();};$('firms').append(button);});
function chart(series,labels,isMoney){const w=620,h=200,left=72,right=16,top=12,bottom=32;const max=Math.max(1,...series.flat()),x=i=>left+i/Math.max(1,frames.length-1)*(w-left-right),y=v=>h-bottom-v/max*(h-top-bottom);let s=`<svg class="chart" role="img" aria-label="${labels.join(' and ')} across periods" viewBox="0 0 ${w} ${h}">`;for(let j=0;j<=4;j++){let v=max*j/4;s+=`<line x1="${left}" x2="${w-right}" y1="${y(v)}" y2="${y(v)}" stroke="#e1e6e9"/><text x="${left-6}" y="${y(v)+4}" text-anchor="end" font-size="11">${isMoney?'$':''}${v>=1e6?(v/1e6).toFixed(1)+'m':v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0)}</text>`;}series.forEach((values,j)=>{s+=`<polyline fill="none" stroke="${j?'#ba5a22':'#245b91'}" stroke-width="2" points="${values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"/>`;});s+=`<line x1="${x(period)}" x2="${x(period)}" y1="${top}" y2="${h-bottom}" stroke="#17252c" stroke-dasharray="4 3"/><text x="${left}" y="${h-8}" font-size="12">Period 0</text><text x="${w-right}" y="${h-8}" text-anchor="end" font-size="12">${frames.length-1}</text></svg>`;return s;}
function cashFlow(frame,id,person){
 let incoming=0,outgoing=0;
 for(const t of frame.transfers){const amount=Number(t.amount);
  if(person){
   if(t.kind==='income'&&t.person===id)incoming+=amount;
   if(t.kind==='rent'){if(t.person===id)outgoing+=amount;if(t.recipient===id)incoming+=amount;}
   if(t.kind==='premium'&&t.person===id)outgoing+=amount;
   if(t.kind==='claim'&&t.person===id)incoming+=amount;
  }else if(t.firm===id){if(t.kind==='premium')incoming+=amount;if(t.kind==='claim')outgoing+=amount;}
 }
 return [incoming,outgoing];
}
function chartData(view,id,person){
 if(view==='flows'){
  const values=frames.map(f=>cashFlow(f,id,person));
  return {title:person?'Person · money in and out':'Insurer · money in and out',labels:['Received','Paid'],series:[values.map(v=>v[0]),values.map(v=>v[1])],money:true,note:'Actual cash transfers per period. Period 0 includes opening premiums. Unpaid amounts are excluded.'};
 }
 if(view==='claims'){
  let due=0,paid=0;const values=frames.map(f=>{for(const t of f.transfers){if(t.kind==='claim'&&(person?t.person===id:t.firm===id)){due+=Number(t.due);paid+=Number(t.amount);}}return [due,paid];});
  return {title:person?'Person · cumulative insurance claims':'Insurer · cumulative insurance claims',labels:['Due','Paid'],series:[values.map(v=>v[0]),values.map(v=>v[1])],money:true,note:'Contractual claims only. The gap is unpaid claims caused by insufficient insurer capital; it excludes uninsured losses and deductibles.'};
 }
 if(view==='disasters'){
  return {title:`“${worldName}” · disaster counts`,labels:['Observed','Expected'],series:[frames.map(f=>f.events.length),frames.map((f,i)=>i===0?0:(data.rates?.[i-1]??0.5))],money:false,note:'Whole-world event counts per period, not losses or the selected agent’s exposure. Period 0 has no disasters. Random counts fluctuate around the expected rate.'};
 }
 return person?{title:'Person · cash and property',labels:['Cash','Property'],series:[frames.map(f=>Number(f.people.find(p=>p.id===id).cash)),frames.map(f=>f.homes.filter(h=>h.owner===id).reduce((n,h)=>n+Number(h.value),0))],money:true,note:'End-of-period balances. Destroyed titles remain owned but have zero modeled property value.'}:{title:'Insurer · capital',labels:['Capital'],series:[frames.map(f=>Number(f.firms.find(x=>x.id===id).capital))],money:true,note:'Capital after premiums and claims. Zero capital limits future claim payments.'};
}
function renderChart(){
 const d=chartData(chartView,selectedId,selectedKind==='person');
 document.querySelectorAll('[data-chart]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.chart===chartView)));
 $('chartTitle').textContent=d.title;$('history').innerHTML=chart(d.series,d.labels,d.money);
 $('chartKey').innerHTML=d.labels.map((label,i)=>`<span class="${i?'orange':'blue'}">— ${label}</span>`).join('')+'<span>┊ Selected period</span>';
 $('chartNote').textContent=d.note;
 const format=v=>d.money?money(v):Number(v).toLocaleString('en-US',{maximumFractionDigits:3});
 $('chartValues').textContent=`Period ${period} · `+d.labels.map((label,i)=>`${label} ${format(d.series[i][period])}`).join(' · ')+(chartView==='claims'?` · Unpaid ${money(d.series[0][period]-d.series[1][period])}`:'');
}
document.querySelectorAll('[data-chart]').forEach(b=>b.onclick=()=>{chartView=b.dataset.chart;renderChart();});
function renderHome(){
 const h=frames[period].homes.find(h=>h.id===homeId);
 const initial=frames[0].homes.find(x=>x.id===homeId);
 const resident=h.resident??initial.resident;
 const former=h.resident===null;
 const policies=covered(frames[period]).filter(c=>c.home===h.id);
 $('home').innerHTML=`<div class="home-heading"><strong>Home ${h.id}</strong><span>${h.destroyed?'Destroyed':money(h.value)}</span></div><div class="person-buttons"><button id="inspectOwner" aria-label="Follow owner ${h.owner}" aria-pressed="${selectedKind==='person'&&selectedId===h.owner}">${personIcon} Owner ${h.owner}</button>${resident&&resident!==h.owner?`<button id="inspectResident" aria-label="Follow ${former?'former ':''}resident ${resident}" aria-pressed="${selectedKind==='person'&&selectedId===resident}">${personIcon} ${former?'Former resident':'Resident'} ${resident}</button>`:''}</div><details><summary>Home details</summary><p>Row ${h.position[0]}, column ${h.position[1]}. ${h.destroyed?'Destroyed; owner retains title.':'Intact.'} ${h.resident?'Resident '+h.resident:'No current resident.'}</p><p>${policies.length?policies.map(c=>`${c.product}: firm ${c.firm}, person ${c.person}`).join('<br>'):'No current coverage on an intact home.'}</p></details>`;
 $('inspectOwner').onclick=()=>selectPerson(h.owner);
 if($('inspectResident'))$('inspectResident').onclick=()=>selectPerson(resident);
}
function selectPerson(id){selectedKind='person';selectedId=id;render();}
function events(){const f=frames[period];$('event').replaceChildren(new Option('All events',''),...f.events.map(e=>new Option(`Event ${e.id} · ${e.losses.length} new losses`,e.id)));}
function render(){
$('worldName').textContent=`“${worldName}” world`;document.title=`Insurance Land · “${worldName}”`;
document.querySelectorAll('[data-world]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.world===worldName)));
const f=frames[period],id=selectedId,person=selectedKind==='person',layer=$('layer').value,policies=covered(f);document.querySelectorAll('[data-firm]').forEach(b=>b.setAttribute('aria-pressed',String(!person&&Number(b.dataset.firm)===id)));$('period').value=period;$('periodLabel').value=period;$('previous').disabled=period===0;$('next').disabled=period===frames.length-1;const chosen=f.events.filter(e=>!$('event').value||e.id===Number($('event').value));const hits=new Set(chosen.flatMap(e=>e.cells.map(c=>c.join(','))));const owned=f.homes.filter(h=>h.owner===id),residence=f.homes.find(h=>h.resident===id);const relevant=policies.filter(c=>person?c.person===id:c.firm===id);f.homes.forEach(h=>{let b=buttons.get(h.id),at=policies.filter(c=>c.home===h.id);b.className='cell';let label='';if(layer==='ownership'){label=h.owner;b.style.background=palette[h.owner%palette.length];}else if(layer==='residence'){label=h.resident??'–';b.style.background=h.resident?palette[h.resident%palette.length]:'#fff';}else if(layer==='value'){label=Math.round(Number(h.value)/1000)+'k';const bucket=Math.min(4,Math.floor(Number(h.value)/initialMax*5));b.style.background=['#ffffd4','#fee391','#fec44f','#fe9929','#cc4c02'][bucket];}else if(layer==='coverage'){label=at.length?at.map(c=>c.product==='renters'?'R':'B').join('/'):'–';b.style.background=at.length?'#b3cde3':'#fff';}else{label=h.destroyed?'×':'·';b.style.background='#fff';}if(h.destroyed){b.classList.add('destroyed');label='× '+label;}if(person?h.owner===id:relevant.some(c=>c.home===h.id))b.classList.add('selected');if(person&&h.resident===id)b.classList.add('residence');if(hits.has(h.position.join(',')))b.classList.add('hit');b.textContent=label;b.setAttribute('aria-label',`Home ${h.id}, row ${h.position[0]}, column ${h.position[1]}, owner ${h.owner}, resident ${h.resident??'none'}, ${h.destroyed?'destroyed':'intact'}, value ${money(h.value)}`);b.title=b.getAttribute('aria-label')+(layer==='coverage'?'; B: building coverage. R: renters contents. R/B: both.':'');});
$('coverageKey').hidden=layer!=='coverage';$('legend').textContent={ownership:'Numbers identify owners; colors are categorical and reused. Use labels to identify the same person.',residence:'Numbers identify residents; – means no resident.',value:'Values in thousands of dollars. Darker orange means higher value; fixed scale across periods.',coverage:'B = building policy; R = renters contents policy. Both can cover one home. Only intact, in-term interests shown.',damage:'× means destroyed; · means intact. Destroyed homes retain their owner.'}[layer];
const selectedTransfers=f.transfers.filter(t=>person?(t.person===id||t.recipient===id):t.firm===id);let stats=[];if(person){let p=f.people.find(p=>p.id===id),wealth=owned.reduce((n,h)=>n+Number(h.value),0);let roles=[];if(residence)roles.push(residence.owner===id?'Owner-occupier':'Renter');else roles.push('No residence');if(owned.some(h=>h.resident!==null&&h.resident!==id))roles.push('Landlord');if(owned.some(h=>h.destroyed))roles.push('Owns destroyed title(s)');$('agentTitle').textContent=`Person ${id}`;$('roles').textContent=roles.join(' · ');stats=[['Cash',money(p.cash)],['Property wealth',money(wealth)],['Net position',money(Number(p.cash)+wealth)],['Annual external income',money(p.annual_income)],['Owned titles',owned.length],['Current policies',relevant.length]];}else{let firm=f.firms.find(x=>x.id===id);$('agentTitle').textContent=`Firm ${firm.name} (${id})`;$('roles').textContent=Number(firm.capital)>0?'Capital available':'Capital exhausted';const ts=frames.slice(0,period+1).flatMap(f=>f.transfers).filter(t=>t.firm===id);const sum=(kind,key)=>ts.filter(t=>t.kind===kind).reduce((n,t)=>n+Number(t[key]||0),0);stats=[['Capital',money(firm.capital)],['Current policies',relevant.length],['Premium receipts to date',money(sum('premium','amount'))],['Claims due to date',money(sum('claim','due'))],['Claims paid to date',money(sum('claim','amount'))],['Shortfall to date',money(sum('claim','shortfall'))]];}
$('stats').innerHTML=stats.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');renderChart();$('flows').innerHTML=selectedTransfers.length?'<table><thead><tr><th>Flow</th><th>Amount</th><th>Details</th></tr></thead><tbody>'+selectedTransfers.map(t=>{let direction=t.kind==='premium'?(person?'Paid':'Received'):t.kind==='claim'?(person?'Received':'Paid'):t.kind==='rent'?(t.recipient===id?'Received':'Paid'):'Received';let detail=t.kind==='claim'?`Due ${money(t.due)}; short ${money(t.shortfall)}`:t.kind==='rent'?`Person ${t.person} → ${t.recipient}; ${t.paid?'paid':'unpaid; requested '+money(t.requested)}`:t.home?'Home '+t.home:'External income';return `<tr><td>${t.kind} · ${direction}</td><td>${money(t.amount)}</td><td>${detail}</td></tr>`;}).join('')+'</tbody></table>':'<p>No transfers for this agent in this period. Use Previous or Next to inspect another period.</p>';
const destroyed=f.homes.filter(h=>h.destroyed).length,displaced=f.people.length-f.homes.filter(h=>h.resident!==null).length;$('status').textContent=`Period ${period} · ${f.events.length} events · ${data.rates?'expected rate '+Number(data.rates[Math.max(0,period-1)]).toFixed(3)+' · ':''}${destroyed} destroyed homes · ${displaced} people without a residence`;$('eventInfo').textContent=chosen.length?`${chosen.length} event(s) highlighted; ${chosen.reduce((n,e)=>n+e.losses.length,0)} new building losses; ${chosen.reduce((n,e)=>n+e.displaced.length,0)} newly displaced people.`:'No disasters this period. Advance the period to inspect later events.';renderHome();}
$('period').oninput=()=>{period=Number($('period').value);events();render();};$('previous').onclick=()=>{period--;events();render();};$('next').onclick=()=>{period++;events();render();};['layer','event'].forEach(id=>$(id).onchange=render);events();render();
</script></html>
